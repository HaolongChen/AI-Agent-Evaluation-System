input SessionFilters {
  evaluatorId: String
  copilotOutputId: String
  rubricId: String
  evaluatorType: EvaluatorType
}

input EvaluationInput {
  criteriaId: String!
  "Binary evaluation"
  evaluation: Boolean!
  "Detailed explanation of the evaluation"
  feedback: String
}

input HumanEvaluationInput {
  evaluatorId: String!
  copilotOutputId: String!
  rubricId: String!
  evaluations: [EvaluationInput!]!
}

input GoldenSetInput {
  schemaId: String!
}

input UserInputInput {
  content: String!
  createdBy: String
}

input CopilotInputInput {
  goldenSetId: String!
  userInputId: String!
}
